<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#221a38"/>
      <stop offset="55%" stop-color="#120f1e"/>
      <stop offset="100%" stop-color="#0a0912"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c5cf6"/>
      <stop offset="100%" stop-color="#ff6aa8"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 512 512">
      <radialGradient id="logoBg" cx="32%" cy="26%" r="85%">
        <stop offset="0%" stop-color="#1c1530"/>
        <stop offset="100%" stop-color="#0a0912"/>
      </radialGradient>
      <linearGradient id="barGrad" x1="98" y1="0" x2="414" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#8c5cf6"/>
        <stop offset="100%" stop-color="#ff6aa8"/>
      </linearGradient>
      <circle cx="256" cy="256" r="256" fill="url(#logoBg)"/>
      <g transform="rotate(-11 256 256)">
        <path d="M246,208 H154 A48,48 0 0 0 154,304 H246 Z" fill="url(#barGrad)"/>
        <path d="M266,208 H358 A48,48 0 0 1 358,304 H266 Z" fill="url(#barGrad)"/>
        <circle cx="140" cy="256" r="14" fill="#f3f1f8" opacity="0.94"/>
        <circle cx="372" cy="256" r="14" fill="#f3f1f8" opacity="0.94"/>
      </g>
    </symbol>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- safe zone: keep content between y=250 and y=1650 -->
  <use href="#logo" x="440" y="320" width="200" height="200"/>

  <text x="540" y="640" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="24" letter-spacing="2" fill="#9d99b9">NOUVEAU POST</text>

  <text x="540" y="760" text-anchor="middle" font-family="Avenir Next, Futura, sans-serif" font-weight="800" font-size="72" letter-spacing="-1.5" fill="#f3f1f8">Soirée <tspan fill="url(#textGrad)">coop</tspan></text>

  <text x="540" y="840" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="34" fill="#c9c6dc">Overcooked! 2 · It Takes Two</text>
  <text x="540" y="884" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="34" fill="#c9c6dc">Pikmin 4</text>

  <text x="540" y="960" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="28" fill="#9d99b9">Le post complet est juste en dessous</text>

  <!-- down chevron -->
  <path d="M 510 1040 L 540 1075 L 570 1040" stroke="#3ee6a8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="440" y1="1560" x2="640" y2="1560" stroke="#292339" stroke-width="1"/>
  <text x="540" y="1610" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="26" letter-spacing="1" fill="#c9c6dc">matesync.fr</text>
